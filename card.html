<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A213F">
  <title>LETO — NFC-карта</title>
  <meta name="description" content="Дизайн NFC-карты ресторана LETO: лицевая сторона, оборот и мокап.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .app{overflow:visible}
    .faces{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin:22px var(--pad) 0;
    }
    .faces figure,.mock{margin:0}
    .faces img,.mock img{
      width:100%;
      height:auto;
      background:var(--paper);
      border:1px solid var(--line);
      box-shadow:0 18px 40px -20px rgba(26,33,63,.45);
    }
    .faces img{border-radius:16px}
    .mock{margin:22px var(--pad) 0}
    .mock img{border-radius:22px}
    .faces figcaption,.mock figcaption{
      margin-top:10px;
      text-align:center;
      font:700 10.5px/1 var(--sans);
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .card-note{max-width:42ch}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Назад к сайту"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></a>
    <img class="topbar__logo" src="assets/leto-logo.svg" alt="LETO">
    <span class="topbar__spacer"></span>
  </header>
  <h1 class="title">NFC-карта</h1>
  <p class="intro card-note">Лицевая сторона, оборот и визуализация карты ресторана LETO. Исходники для печати — в папке card.</p>
  <div class="faces">
    <figure>
      <img src="card/card-front.png" alt="Лицевая сторона карты LETO" width="709" height="1082">
      <figcaption>Лицевая</figcaption>
    </figure>
    <figure>
      <img src="card/card-back.png" alt="Оборот карты LETO: NFC и QR" width="709" height="1082">
      <figcaption>Оборот</figcaption>
    </figure>
  </div>
  <figure class="mock">
    <img src="card/mockup.png" alt="Мокап обеих сторон карты LETO" width="2400" height="1600">
    <figcaption>Мокап</figcaption>
  </figure>
  <p class="foot">Формат 54 × 85,6 мм · QR на обороте — заглушка</p>
</div>
</body>
</html>
